services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lychee
      POSTGRES_PASSWORD: lychee_dev_password
      POSTGRES_DB: lychee_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: lychee
      POSTGRES_PASSWORD: lychee_dev_password
      POSTGRES_DB: lychee_test
    ports:
      - "5433:5432"

volumes:
  pgdata:
