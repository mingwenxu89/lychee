services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lychee
      POSTGRES_PASSWORD: lychee_dev_password
      POSTGRES_DB: lychee_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: lychee
      POSTGRES_PASSWORD: lychee_dev_password
      POSTGRES_DB: lychee_test
    ports:
      - "5433:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=lychee_dev;Username=lychee;Password=lychee_dev_password"
      Jwt__Secret: "REPLACE_WITH_A_LOCAL_DEV_ONLY_SECRET_AT_LEAST_32_BYTES"
      Jwt__Issuer: "lychee-dev"
      Jwt__Audience: "lychee-dev-clients"
      FrontendBaseUrl: "http://localhost:3000"
      Storage__Provider: "Local"
      Storage__LocalBaseUrl: "http://localhost:5000/local-blobs"
    depends_on:
      - postgres

volumes:
  pgdata:
